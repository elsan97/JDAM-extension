<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #eee; padding: 16px; margin: 0; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    button { width: 100%; padding: 12px; background: #c0392b; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
    button:hover { background: #e74c3c; }
    button:disabled { background: #555; cursor: wait; }
    .hint { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }
    .log-toggle { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; cursor: pointer; user-select: none; }
    .status { margin-top: 8px; font-size: 11px; color: #7fd67f; min-height: 14px; }
    .status.err { color: #ff6b6b; }
    .lang-select { width: 100%; margin-top: 12px; padding: 6px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; }
  </style>
</head>
<body>
  <h1 data-i18n="extName">JDAM Clicker 💣</h1>
  <button id="go" data-i18n="btnDrop">СБРОСИТЬ БОМБУ</button>
  <div class="status" id="status"></div>
  <label class="log-toggle">
    <input type="checkbox" id="logToggle">
    <span data-i18n="logToggle">Режим логирования (F12)</span>
  </label>
  <div class="hint" data-i18n="hint">Нажми кнопку → кликни в любую точку страницы → прилетит КАБ.</div>
  <select class="lang-select" id="langSelect">
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="zh_CN">中文</option>
  </select>
  <script src="popup.js"></script>
</body>
</html>
